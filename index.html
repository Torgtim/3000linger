<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer Adventure Lodrett</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial, sans-serif; background:#111; }
canvas { display:block; margin:0 auto; background:#222; }
#hud { position:absolute; top:10px; left:10px; color:white; font-size:18px; }
#message { position:absolute; bottom:10px; left:10px; color:yellow; font-size:20px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud"></div>
<div id="message"></div>
<script>
// ================= GLOBAL VARIABLES =================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

// Lodrett map: 20 cols × 40 rows
let tileCols = 20;
let tileRows = 40;
let tileSize = Math.floor(width/tileCols);
let frame=0;
let round=1;

// ================= PLAYER =================
let player = { x:2, y:2, size:tileSize-10, color:'#0f0', health:100, ammo:0, speed:1 };

// ================= WEAPONS =================
let weapons = [];
for(let i=0;i<30;i++){
  weapons.push({
    x:Math.floor(Math.random()*tileCols),
    y:Math.floor(Math.random()*tileRows),
    type:['Pistol','Shotgun','Rifle','LaserGun','Grenade'][Math.floor(Math.random()*5)],
    ammo:Math.floor(Math.random()*5+1)
  });
}

// ================= BOSSES =================
let bosses = [];
for(let i=0;i<10;i++){
  bosses.push({
    x:Math.floor(Math.random()*tileCols),
    y:Math.floor(Math.random()*tileRows),
    health:100+Math.floor(Math.random()*200),
    defeated:false,
    color:'#'+Math.floor(Math.random()*16777215).toString(16)
  });
}

// ================= MINIBOSSES =================
let minibosses = [];
for(let i=0;i<20;i++){
  minibosses.push({
    x:Math.floor(Math.random()*tileCols),
    y:Math.floor(Math.random()*tileRows),
    health:50+Math.floor(Math.random()*100),
    defeated:false,
    color:'#'+Math.floor(Math.random()*16777215).toString(16),
    dirX:Math.random()>0.5?1:-1,
    dirY:Math.random()>0.5?1:-1
  });
}

// ================= PARTICLES =================
let particles = [];

// ================= INPUT =================
let keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
let touchX=null;
canvas.addEventListener('touchstart', e=>touchX=e.touches[0].clientX);
canvas.addEventListener('touchmove', e=>{
  let dx = e.touches[0].clientX - touchX;
  player.x += dx/tileSize;
  if(player.x<0) player.x=0;
  if(player.x>tileCols-1) player.x=tileCols-1;
  touchX = e.touches[0].clientX;
});

// ================= DRAW FUNCTIONS =================
function drawMap(){
  ctx.strokeStyle='#555';
  for(let i=0;i<tileCols;i++){
    for(let j=0;j<tileRows;j++){
      ctx.strokeRect(i*tileSize,j*tileSize,tileSize,tileSize);
    }
  }
}
function drawPlayer(){
  ctx.fillStyle=player.color;
  ctx.fillRect(player.x*tileSize+5, player.y*tileSize+5, player.size, player.size);
}
function drawWeapons(){
  weapons.forEach(w=>{
    ctx.fillStyle='yellow';
    ctx.fillRect(w.x*tileSize+tileSize/4,w.y*tileSize+tileSize/4,tileSize/2,tileSize/2);
  });
}
function drawBosses(){
  bosses.forEach(b=>{
    if(!b.defeated){
      ctx.fillStyle=b.color;
      ctx.fillRect(b.x*tileSize+5,b.y*tileSize+5,tileSize-10,tileSize-10);
      ctx.fillStyle='green';
      let barWidth = (tileSize-10)*(b.health/200);
      ctx.fillRect(b.x*tileSize+5,b.y*tileSize,barWidth,5);
    }
  });
}
function drawMinibosses(){
  minibosses.forEach(b=>{
    if(!b.defeated){
      ctx.fillStyle=b.color;
      ctx.fillRect(b.x*tileSize+5,b.y*tileSize+5,tileSize-10,tileSize-10);
      ctx.fillStyle='orange';
      let barWidth = (tileSize-10)*(b.health/150);
      ctx.fillRect(b.x*tileSize+5,b.y*tileSize,barWidth,3);
    }
  });
}
function drawParticles(){
  particles.forEach((p,i)=>{
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
    p.y -= p.speedY;
    p.x += p.speedX;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  });
}

// ================= UPDATE FUNCTIONS =================
function updatePlayer(){
  if(keys['ArrowUp'] && player.y>0) player.y-=player.speed;
  if(keys['ArrowDown'] && player.y<tileRows-1) player.y+=player.speed;
  if(keys['ArrowLeft'] && player.x>0) player.x-=player.speed;
  if(keys['ArrowRight'] && player.x<tileCols-1) player.x+=player.speed;

  weapons.forEach((w,i)=>{
    if(Math.floor(player.x)===w.x && Math.floor(player.y)===w.y){
      player.ammo+=w.ammo;
      weapons.splice(i,1);
      showMessage(`Picked ${w.type} x${w.ammo}!`);
      spawnParticles(player.x*tileSize+tileSize/2,player.y*tileSize+tileSize/2,10,'yellow');
    }
  });

  bosses.forEach(b=>{
    if(!b.defeated && Math.floor(player.x)===b.x && Math.floor(player.y)===b.y){
      if(player.ammo>0){player.ammo--;b.health-=50;spawnParticles(b.x*tileSize+tileSize/2,b.y*tileSize+tileSize/2,15,'red');if(b.health<=0){b.defeated=true;showMessage('Boss defeated!');}}
      else{player.health-=10;spawnParticles(player.x*tileSize+tileSize/2,player.y*tileSize+tileSize/2,10,'white');if(player.health<=0) showMessage('You died! Game Over.');}
    }
  });

  minibosses.forEach(b=>{
    b.x += 0.05*b.dirX;
    b.y += 0.05*b.dirY;
    if(b.x<0 || b.x>tileCols-1) b.dirX*=-1;
    if(b.y<0 || b.y>tileRows-1) b.dirY*=-1;
    if(!b.defeated && Math.floor(player.x)===Math.floor(b.x) && Math.floor(player.y)===Math.floor(b.y)){
      if(player.ammo>0){player.ammo--;b.health-=25;spawnParticles(b.x*tileSize+tileSize/2,b.y*tileSize+tileSize/2,8,'orange');if(b.health<=0){b.defeated=true;showMessage('Miniboss defeated!');}}
      else{player.health-=5;spawnParticles(player.x*tileSize+tileSize/2,player.y*tileSize+tileSize/2,5,'white');}
    }
  });
}

// ================= PARTICLE SYSTEM =================
function spawnParticles(x,y,count,color){
  for(let i=0;i<count;i++){
    particles.push({x:x,y:y,size:Math.random()*5+2,color:color,speedX:(Math.random()-0.5)*2,speedY:Math.random()*2+1,life:30+Math.random()*30});
  }
}

// ================= HUD & MESSAGE =================
function updateHUD(){
  let bossesLeft = bosses.filter(b=>!b.defeated).length;
  let minibossesLeft = minibosses.filter(b=>!b.defeated).length;
  document.getElementById('hud').innerText=
    `Health: ${player.health} | Ammo: ${player.ammo} | Bosses: ${bossesLeft} | Minibosses: ${minibossesLeft} | Round: ${round}`;
}
function showMessage(msg){
  document.getElementById('message').innerText=msg;
  setTimeout(()=>{document.getElementById('message').innerText='';},2000);
}

// ================= ROUND SYSTEM =================
function checkRound(){
  if(bosses.every(b=>b.defeated) && minibosses.every(b=>b.defeated)){
    round++;
    spawnNewRound(round);
  }
}
function spawnNewRound(r){
  for(let i=0;i<10;i++){bosses[i]={x:Math.floor(Math.random()*tileCols),y:Math.floor(Math.random()*tileRows),health:100+50*r,defeated:false,color:'#'+Math.floor(Math.random()*16777215).toString(16)};}
  for(let i=0;i<20;i++){minibosses[i]={x:Math.floor(Math.random()*tileCols),y:Math.floor(Math.random()*tileRows),health:50+30*r,defeated:false,color:'#'+Math.floor(Math.random()*16777215).toString(16),dirX:Math.random()>0.5?1:-1,dirY:Math.random()>0.5?1:-1};}
  weapons=[];for(let i=0;i<30;i++){weapons.push({x:Math.floor(Math.random()*tileCols),y:Math.floor(Math.random()*tileRows),type:['Pistol','Shotgun','Rifle','LaserGun','Grenade'][Math.floor(Math.random()*5)],ammo:Math.floor(Math.random()*5+1)});}
  showMessage(`Round ${r} started!`);
}

// ================= GAME LOOP =================
function draw(){ctx.clearRect(0,0,width,height);drawMap();drawWeapons();drawBosses();drawMinibosses();drawPlayer();drawParticles();}
function loop(){frame++;updatePlayer();updateHUD();checkRound();draw();if(player.health>0) requestAnimationFrame(loop);}
loop();

// ================= HELPER / FILLER FUNCTIONS =================
function filler1(){console.log('filler1');}function filler2(){console.log('filler2');}function filler3(){console.log('filler3');}function filler4(){console.log('filler4');}function filler5(){console.log('filler5');}function filler6(){console.log('filler6');}function filler7(){console.log('filler7');}function filler8(){console.log('filler8');}function filler9(){console.log('filler9');}function filler10(){console.log('filler10');}

// =================================================
// END OF MAXIMUM CHAT MESSAGE
// =================================================
</script>
</body>
</html>
