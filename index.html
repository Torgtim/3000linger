<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA Weapons</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial;touch-action:none}
canvas{display:block;background:#111}
#hud{position:absolute;top:10px;left:10px;color:#fff}
#msg{position:absolute;bottom:100px;left:10px;color:yellow}

#joy{position:absolute;bottom:10px;left:10px;width:120px;height:120px;background:#ffffff11;border-radius:50%}
#stick{position:absolute;left:40px;top:40px;width:40px;height:40px;background:#ffffff88;border-radius:50%}
#shoot{position:absolute;bottom:10px;right:10px;width:90px;height:90px;background:red;border-radius:50%;opacity:.7}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"></div>

<div id="joy"><div id="stick"></div></div>
<div id="shoot"></div>

<script>
// ===== CANVAS =====
const c=document.getElementById("c");
const x=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let camX=0,camY=0,shake=0;

// ===== PLAYER =====
let p={
x:500,y:1200,
hp:100,
weapon:0,
ammo:[60,25,10] // pistol, shotgun, laser
};

// ===== BUILDINGS =====
let buildings=[];
for(let i=0;i<20;i++){
buildings.push({
x:Math.random()*2000,
y:Math.random()*2000,
w:120+Math.random()*120,
h:120+Math.random()*120
});
}

// ===== AMMO PICKUPS =====
let ammoDrops=[];
for(let i=0;i<20;i++){
ammoDrops.push({
x:Math.random()*2000,
y:Math.random()*2000,
type:Math.floor(Math.random()*3)
});
}

// ===== JOYSTICK =====
let mx=0,my=0,shoot=false;
const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

joy.addEventListener("touchmove",e=>{
let t=e.touches[0],r=joy.getBoundingClientRect();
let dx=t.clientX-(r.left+r.width/2);
let dy=t.clientY-(r.top+r.height/2);
let d=Math.min(Math.hypot(dx,dy),r.width/2);
let a=Math.atan2(dy,dx);
mx=Math.cos(a)*(d/r.width);
my=Math.sin(a)*(d/r.height);
stick.style.left=(40+dx/2)+"px";
stick.style.top=(40+dy/2)+"px";
});
joy.addEventListener("touchend",()=>{mx=my=0;stick.style.left="40px";stick.style.top="40px"});
document.getElementById("shoot").ontouchstart=()=>shoot=true;
document.getElementById("shoot").ontouchend=()=>shoot=false;

// ===== ENEMIES =====
let enemies=[];
for(let i=0;i<15;i++){
enemies.push({x:Math.random()*2000,y:Math.random()*2000,hp:40});
}

// ===== BOSS =====
let boss={x:800,y:200,hp:400};

// ===== BULLETS =====
let bullets=[];
function fire(){
if(p.ammo[p.weapon]<=0) return;

p.ammo[p.weapon]--;

if(p.weapon==0){ // pistol
bullets.push({x:p.x,y:p.y,vx:0,vy:-10,d:15});
}
if(p.weapon==1){ // shotgun
for(let a=-0.4;a<=0.4;a+=0.4){
bullets.push({x:p.x,y:p.y,vx:Math.sin(a)*8,vy:-8,d:10});
}
}
if(p.weapon==2){ // laser
bullets.push({x:p.x,y:p.y,vx:0,vy:-18,d:30});
}
}

// ===== COLLISION BUILDINGS =====
function collide(nx,ny){
for(let b of buildings){
if(nx>b.x && nx<b.x+b.w && ny>b.y && ny<b.y+b.h) return true;
}
return false;
}

// ===== UPDATE =====
function update(){

// movement
let nx=p.x+(mx*3);
let ny=p.y+(my*3);
if(!collide(nx,p.y)) p.x=nx;
if(!collide(p.x,ny)) p.y=ny;

camX=p.x-c.width/2;
camY=p.y-c.height/2;

// shooting
if(shoot && Math.random()<0.35) fire();

// bullets
bullets.forEach((b,i)=>{
b.x+=b.vx;
b.y+=b.vy;

// hit enemies
enemies.forEach(e=>{
if(e.hp>0 && Math.hypot(e.x-b.x,e.y-b.y)<20){
e.hp-=b.d;
shake=6;
}
});

// hit boss
if(Math.hypot(boss.x-b.x,boss.y-b.y)<30){
boss.hp-=b.d;
shake=8;
}
});

// enemies chase + damage
enemies.forEach(e=>{
if(e.hp<=0) return;
let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);
e.x+=dx/d*1.1;
e.y+=dy/d*1.1;
if(d<25) p.hp-=0.15;
});

// boss chase
let dx=p.x-boss.x,dy=p.y-boss.y,d=Math.hypot(dx,dy);
boss.x+=dx/d*0.7;
boss.y+=dy/d*0.7;
if(d<45) p.hp-=0.25;

// pickup ammo
ammoDrops.forEach((a,i)=>{
if(Math.hypot(p.x-a.x,p.y-a.y)<25){
p.ammo[a.type]+=15;
ammoDrops.splice(i,1);
}
});

if(shake>0) shake*=0.9;
}

// ===== DRAW =====
function draw(){
let sx=(Math.random()-0.5)*shake;
let sy=(Math.random()-0.5)*shake;
x.setTransform(1,0,0,1,-camX+sx,-camY+sy);
x.clearRect(camX,camY,c.width,c.height);

// buildings
x.fillStyle="#444";
buildings.forEach(b=>x.fillRect(b.x,b.y,b.w,b.h));

// ammo drops
x.fillStyle="cyan";
ammoDrops.forEach(a=>x.fillRect(a.x-6,a.y-6,12,12));

// player
x.fillStyle="lime";
x.fillRect(p.x-15,p.y-15,30,30);

// enemies
x.fillStyle="orange";
enemies.forEach(e=>{if(e.hp>0)x.fillRect(e.x-10,e.y-10,20,20)});

// boss
x.fillStyle="red";
x.fillRect(boss.x-20,boss.y-20,40,40);

// bullets
x.fillStyle="yellow";
bullets.forEach(b=>x.fillRect(b.x-2,b.y-6,4,10));

// HUD
document.getElementById("hud").innerText=
"HP:"+Math.floor(p.hp)+
" | Ammo P:"+p.ammo[0]+" S:"+p.ammo[1]+" L:"+p.ammo[2]+
" | Weapon:"+["Pistol","Shotgun","Laser"][p.weapon];

if(p.hp<=0) document.getElementById("msg").innerText="💀 YOU DIED";
if(boss.hp<=0) document.getElementById("msg").innerText="🏆 BOSS DESTROYED";
}

// ===== LOOP =====
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();

// ===== SWITCH WEAPON =====
addEventListener("dblclick",()=>{
p.weapon=(p.weapon+1)%3;
document.getElementById("msg").innerText="Weapon: "+["Pistol","Shotgun","Laser"][p.weapon];
});
</script>
</body>
</html>
