<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer Adventure - Atack</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial, sans-serif; background:#111; }
canvas { display:block; margin:0 auto; background:#222; }
#hud { position:absolute; top:10px; left:10px; color:white; font-size:18px; }
#message { position:absolute; bottom:10px; left:10px; color:yellow; font-size:20px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud"></div>
<div id="message"></div>
<script>
// ================= GLOBAL VARIABLES =================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

// Lodrett map: 20 cols × 40 rows
let tileCols = 20;
let tileRows = 40;
let tileSize = Math.floor(width/tileCols);
let frame=0;

// ================= PLAYER =================
let player = { x:10, y:38, size:tileSize-10, color:'#0f0', speed:1 };

// ================= ATACK =================
let atack = {
  x:10,
  y:5,
  width:tileSize*2,
  height:tileSize*3,
  color:'#964B00'
};

// ================= INPUT =================
let keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);

// ================= DRAW FUNCTIONS =================
function drawMap(){
  ctx.strokeStyle='#555';
  for(let i=0;i<tileCols;i++){
    for(let j=0;j<tileRows;j++){
      ctx.strokeRect(i*tileSize,j*tileSize,tileSize,tileSize);
    }
  }
}
function drawPlayer(){
  ctx.fillStyle=player.color;
  ctx.fillRect(player.x*tileSize+5, player.y*tileSize+5, player.size, player.size);
}
function drawAtack(){
  ctx.fillStyle=atack.color;
  ctx.fillRect(atack.x*tileSize, atack.y*tileSize, atack.width, atack.height);
}

// ================= UPDATE PLAYER =================
function updatePlayer(){
  if(keys['ArrowUp'] && player.y>0) player.y-=player.speed;
  if(keys['ArrowDown'] && player.y<tileRows-1) player.y+=player.speed;
  if(keys['ArrowLeft'] && player.x>0) player.x-=player.speed;
  if(keys['ArrowRight'] && player.x<tileCols-1) player.x+=player.speed;

  // Kollisjon / interaksjon med Atack
  if(player.x*tileSize + player.size > atack.x*tileSize &&
     player.x*tileSize < atack.x*tileSize + atack.width &&
     player.y*tileSize + player.size > atack.y*tileSize &&
     player.y*tileSize < atack.y*tileSize + atack.height){
    showMessage("Du står ved Atack!");
  }
}

// ================= HUD & MESSAGE =================
function updateHUD(){
  document.getElementById('hud').innerText=
    `Player X:${player.x} Y:${player.y}`;
}
function showMessage(msg){
  document.getElementById('message').innerText=msg;
  setTimeout(()=>{document.getElementById('message').innerText='';},2000);
}

// ================= DRAW =================
function draw(){
  ctx.clearRect(0,0,width,height);
  drawMap();
  drawAtack();
  drawPlayer();
}

// ================= GAME LOOP =================
function loop(){
  frame++;
  updatePlayer();
  updateHUD();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
