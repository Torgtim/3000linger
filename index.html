<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer Adventure</title>
<style>
body {margin:0; overflow:hidden; font-family:Arial, sans-serif; background:#111;}
canvas {display:block; margin:0 auto; background:#222;}
#hud {position:absolute; top:10px; left:10px; color:white; font-size:18px;}
#message {position:absolute; bottom:10px; left:10px; color:yellow; font-size:20px;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud"></div>
<div id="message"></div>
<script>
// =================================================
// GLOBAL VARIABLES
// =================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

const tileSize = 50;
let mapCols = Math.floor(width / tileSize);
let mapRows = Math.floor(height / tileSize);

let frame = 0;
let round = 1;

// =================================================
// PLAYER
// =================================================
let player = {x:2, y:2, size:40, color:'#0f0', health:100, ammo:0};

// =================================================
// ITEMS
// =================================================
let weapons = [{x:5, y:5, type:'Pistol'}, {x:10, y:8, type:'Shotgun'}];
let bosses = [{x:15, y:10, health:200, defeated:false}];

// =================================================
// INPUT
// =================================================
let keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);

// =================================================
// DRAW FUNCTIONS
// =================================================
function drawMap(){
  ctx.strokeStyle='#555';
  for(let i=0;i<mapCols;i++){
    for(let j=0;j<mapRows;j++){
      ctx.strokeRect(i*tileSize,j*tileSize,tileSize,tileSize);
    }
  }
}
function drawPlayer(){
  ctx.fillStyle=player.color;
  ctx.fillRect(player.x*tileSize+5, player.y*tileSize+5, player.size, player.size);
}
function drawWeapons(){
  weapons.forEach(w=>{
    ctx.fillStyle='yellow';
    ctx.fillRect(w.x*tileSize+15, w.y*tileSize+15, 20, 20);
  });
}
function drawBosses(){
  bosses.forEach(b=>{
    if(!b.defeated){
      ctx.fillStyle='red';
      ctx.fillRect(b.x*tileSize+5, b.y*tileSize+5, 40, 40);
    }
  });
}

// =================================================
// UPDATE FUNCTIONS
// =================================================
function updatePlayer(){
  if(keys['ArrowUp'] && player.y>0) player.y--;
  if(keys['ArrowDown'] && player.y<mapRows-1) player.y++;
  if(keys['ArrowLeft'] && player.x>0) player.x--;
  if(keys['ArrowRight'] && player.x<mapCols-1) player.x++;

  // Pick up weapons
  weapons.forEach((w,i)=>{
    if(player.x===w.x && player.y===w.y){
      player.ammo++;
      weapons.splice(i,1);
      showMessage(`Picked up ${w.type}!`);
    }
  });

  // Boss encounters
  bosses.forEach(b=>{
    if(!b.defeated && player.x===b.x && player.y===b.y){
      if(player.ammo>0){
        player.ammo--;
        b.health-=50;
        showMessage('You hit the boss!');
        if(b.health<=0){
          b.defeated=true;
          showMessage('Boss defeated!');
        }
      } else {
        player.health-=10;
        showMessage('Ouch! No ammo!');
        if(player.health<=0){
          showMessage('You died! Game Over.');
        }
      }
    }
  });
}

// =================================================
// HUD & MESSAGES
// =================================================
function updateHUD(){
  let bossesLeft = bosses.filter(b=>!b.defeated).length;
  document.getElementById('hud').innerText=`Health: ${player.health} | Ammo: ${player.ammo} | Bosses: ${bossesLeft} | Round: ${round}`;
}
function showMessage(msg){
  document.getElementById('message').innerText=msg;
  setTimeout(()=>{document.getElementById('message').innerText='';},2000);
}

// =================================================
// ROUND SYSTEM
// =================================================
function checkRound(){
  if(bosses.every(b=>b.defeated)){
    round++;
    // Spawn new bosses & weapons
    bosses = [];
    for(let i=0;i<round;i++){
      bosses.push({x:Math.floor(Math.random()*mapCols), y:Math.floor(Math.random()*mapRows), health:100+round*50, defeated:false});
    }
    weapons = [];
    for(let i=0;i<round+1;i++){
      weapons.push({x:Math.floor(Math.random()*mapCols), y:Math.floor(Math.random()*mapRows), type:'Pistol'});
    }
    showMessage(`Round ${round} started!`);
  }
}

// =================================================
// GAME LOOP
// =================================================
function draw(){
  ctx.clearRect(0,0,width,height);
  drawMap();
  drawWeapons();
  drawBosses();
  drawPlayer();
}
function loop(){
  frame++;
  updatePlayer();
  updateHUD();
  checkRound();
  draw();
  if(player.health>0){
    requestAnimationFrame(loop);
  }
}

loop();
</script>
</body>
</html>
