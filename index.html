<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer Adventure Horizontal</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial, sans-serif; background:#111; }
canvas { display:block; margin:0 auto; background:#222; }
#hud { position:absolute; top:10px; left:10px; color:white; font-size:18px; }
#message { position:absolute; bottom:10px; left:10px; color:yellow; font-size:20px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud"></div>
<div id="message"></div>
<script>
// =================================================
// GLOBAL VARIABLES
// =================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

// Horizontal grid: 40 cols × 20 rows
const tileCols = 40;
const tileRows = 20;
const tileSize = Math.floor(width/tileCols);

let frame = 0;
let round = 1;

// =================================================
// PLAYER
// =================================================
let player = { x:2, y:2, size:tileSize-10, color:'#0f0', health:100, ammo:0, speed:1 };

// =================================================
// ITEMS
// =================================================
let weapons = [
  { x:5, y:5, type:'Pistol' },
  { x:15, y:8, type:'Shotgun' },
  { x:22, y:12, type:'Rifle' }
];

let bosses = [
  { x:35, y:10, health:200, defeated:false, color:'#f00' }
];

let particles = [];

// =================================================
// INPUT
// =================================================
let keys = {};
window.addEventListener('keydown', e => keys[e.key]=true);
window.addEventListener('keyup', e => keys[e.key]=false);

let touchX = null;
canvas.addEventListener('touchstart', e => { touchX=e.touches[0].clientX; });
canvas.addEventListener('touchmove', e => {
  let dx = e.touches[0].clientX - touchX;
  player.x += dx / tileSize;
  if(player.x<0) player.x=0;
  if(player.x>tileCols-1) player.x=tileCols-1;
  touchX = e.touches[0].clientX;
});

// =================================================
// DRAW FUNCTIONS
// =================================================
function drawMap() {
  ctx.strokeStyle='#555';
  for(let i=0;i<tileCols;i++){
    for(let j=0;j<tileRows;j++){
      ctx.strokeRect(i*tileSize, j*tileSize, tileSize, tileSize);
    }
  }
}

function drawPlayer() {
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x*tileSize+5, player.y*tileSize+5, player.size, player.size);
}

function drawWeapons() {
  weapons.forEach(w=>{
    ctx.fillStyle='yellow';
    ctx.fillRect(w.x*tileSize+tileSize/4, w.y*tileSize+tileSize/4, tileSize/2, tileSize/2);
  });
}

function drawBosses() {
  bosses.forEach(b=>{
    if(!b.defeated){
      ctx.fillStyle=b.color;
      ctx.fillRect(b.x*tileSize+5, b.y*tileSize+5, tileSize-10, tileSize-10);
      ctx.fillStyle='green';
      let barWidth = tileSize-10*(b.health/200);
      ctx.fillRect(b.x*tileSize+5, b.y*tileSize, barWidth, 5);
    }
  });
}

function drawParticles() {
  particles.forEach((p,i)=>{
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    p.y -= p.speedY;
    p.x += p.speedX;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  });
}

// =================================================
// UPDATE FUNCTIONS
// =================================================
function updatePlayer() {
  if(keys['ArrowUp'] && player.y>0) player.y-=player.speed;
  if(keys['ArrowDown'] && player.y<tileRows-1) player.y+=player.speed;
  if(keys['ArrowLeft'] && player.x>0) player.x-=player.speed;
  if(keys['ArrowRight'] && player.x<tileCols-1) player.x+=player.speed;

  weapons.forEach((w,i)=>{
    if(Math.floor(player.x)===w.x && Math.floor(player.y)===w.y){
      player.ammo++;
      weapons.splice(i,1);
      showMessage(`Picked up ${w.type}!`);
      spawnParticles(player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, 10, 'yellow');
    }
  });

  bosses.forEach(b=>{
    if(!b.defeated && Math.floor(player.x)===b.x && Math.floor(player.y)===b.y){
      if(player.ammo>0){
        player.ammo--;
        b.health-=50;
        showMessage('Hit the boss!');
        spawnParticles(b.x*tileSize+tileSize/2, b.y*tileSize+tileSize/2, 15, 'red');
        if(b.health<=0){
          b.defeated=true;
          showMessage('Boss defeated!');
        }
      } else {
        player.health-=10;
        showMessage('Ouch! No ammo!');
        spawnParticles(player.x*tileSize+tileSize/2, player.y*tileSize+tileSize/2, 10, 'white');
        if(player.health<=0){
          showMessage('You died! Game Over.');
        }
      }
    }
  });
}

// =================================================
// PARTICLE SYSTEM
// =================================================
function spawnParticles(x, y, count, color){
  for(let i=0;i<count;i++){
    particles.push({
      x:x,
      y:y,
      size:Math.random()*5+2,
      color:color,
      speedX:(Math.random()-0.5)*2,
      speedY:Math.random()*2+1,
      life:30+Math.random()*30
    });
  }
}

// =================================================
// HUD & MESSAGE
// =================================================
function updateHUD(){
  let bossesLeft = bosses.filter(b=>!b.defeated).length;
  document.getElementById('hud').innerText=`Health: ${player.health} | Ammo: ${player.ammo} | Bosses: ${bossesLeft} | Round: ${round}`;
}
function showMessage(msg){
  document.getElementById('message').innerText=msg;
  setTimeout(()=>{document.getElementById('message').innerText='';},2000);
}

// =================================================
// ROUND SYSTEM
// =================================================
function checkRound(){
  if(bosses.every(b=>b.defeated)){
    round++;
    bosses = [];
    for(let i=0;i<round;i++){
      bosses.push({x:Math.floor(Math.random()*tileCols), y:Math.floor(Math.random()*tileRows), health:100+round*50, defeated:false, color:'#f00'});
    }
    weapons = [];
    for(let i=0;i<round+1;i++){
      weapons.push({x:Math.floor(Math.random()*tileCols), y:Math.floor(Math.random()*tileRows), type:'Pistol'});
    }
    showMessage(`Round ${round} started!`);
  }
}

// =================================================
// GAME LOOP
// =================================================
function draw(){
  ctx.clearRect(0,0,width,height);
  drawMap();
  drawWeapons();
  drawBosses();
  drawPlayer();
  drawParticles();
}

function loop(){
  frame++;
  updatePlayer();
  updateHUD();
  checkRound();
  draw();
  if(player.health>0) requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
