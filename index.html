<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer Chaos Mobile</title>
<style>
body { margin:0; overflow:hidden; background:#111; font-family:Arial; touch-action:none; }
canvas { display:block; margin:0 auto; background:#222; }
#hud { position:absolute; top:10px; left:10px; color:white; font-size:18px; }
#message { position:absolute; bottom:90px; left:10px; color:yellow; font-size:18px; }

#joystick { position:absolute; bottom:10px; left:10px; width:110px; height:110px; background:rgba(255,255,255,0.08); border-radius:50%; }
#stick { position:absolute; left:35px; top:35px; width:40px; height:40px; background:rgba(255,255,255,0.5); border-radius:50%; }

#shootBtn { position:absolute; bottom:10px; right:10px; width:85px; height:85px; background:red; border-radius:50%; opacity:0.7; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="hud"></div>
<div id="message"></div>

<div id="joystick"><div id="stick"></div></div>
<div id="shootBtn"></div>

<script>
// ===== CANVAS =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const COLS = 20;
const ROWS = 40;
const TILE = Math.floor(canvas.width / COLS);

// ===== PLAYER =====
let player = {
  x: 10,
  y: 38,
  hp: 100,
  size: TILE-10,
  speed: 0.08,   // << mindre sensitiv bevegelse
};

// ===== INPUT =====
let moveX=0, moveY=0;
let shooting=false;

// ===== JOYSTICK =====
const joy = document.getElementById("joystick");
const stick = document.getElementById("stick");

joy.addEventListener("touchmove", e=>{
  e.preventDefault();
  const t = e.touches[0];
  const rect = joy.getBoundingClientRect();
  let dx = t.clientX - (rect.left + rect.width/2);
  let dy = t.clientY - (rect.top + rect.height/2);
  let dist = Math.min(Math.sqrt(dx*dx+dy*dy), rect.width/2);

  let angle = Math.atan2(dy,dx);

  // mindre sensitiv
  moveX = Math.cos(angle)*(dist/rect.width)*2;
  moveY = Math.sin(angle)*(dist/rect.height)*2;

  stick.style.left = (35 + dx/2)+"px";
  stick.style.top = (35 + dy/2)+"px";
});

joy.addEventListener("touchend", ()=>{
  moveX=0; moveY=0;
  stick.style.left="35px";
  stick.style.top="35px";
});

// ===== SHOOT =====
document.getElementById("shootBtn").addEventListener("touchstart", ()=>shooting=true);
document.getElementById("shootBtn").addEventListener("touchend", ()=>shooting=false);

// ===== ENEMIES =====
let enemies=[];
for(let i=0;i<10;i++){
  enemies.push({
    x:Math.random()*COLS,
    y:Math.random()*ROWS,
    hp:50,
    type:"mini"
  });
}

// Boss
let boss = {x:10, y:5, hp:200};

// ===== PARTICLES =====
let particles=[];
function explode(x,y,color){
  for(let i=0;i<20;i++){
    particles.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*3,
      vy:(Math.random()-0.5)*3,
      life:30,
      c:color
    });
  }
}

// ===== UPDATE =====
function update(){

  // move player
  player.x += moveX*player.speed*60;
  player.y += moveY*player.speed*60;

  player.x = Math.max(0, Math.min(COLS-1, player.x));
  player.y = Math.max(0, Math.min(ROWS-1, player.y));

  // shooting
  if(shooting){
    enemies.forEach(e=>{
      if(Math.abs(e.x-player.x)<1 && Math.abs(e.y-player.y)<1){
        e.hp -= 1;
        explode(e.x*TILE, e.y*TILE, "orange");
      }
    });

    if(Math.abs(boss.x-player.x)<1.5 && Math.abs(boss.y-player.y)<1.5){
      boss.hp -= 1;
      explode(boss.x*TILE, boss.y*TILE, "red");
    }
  }

  // enemies attack YOU
  enemies.forEach(e=>{
    if(e.hp>0 && Math.abs(e.x-player.x)<0.7 && Math.abs(e.y-player.y)<0.7){
      player.hp -= 0.1;
    }
  });

  if(Math.abs(boss.x-player.x)<1.2 && Math.abs(boss.y-player.y)<1.2){
    player.hp -= 0.2;
  }

  // particles
  particles.forEach((p,i)=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  });
}

// ===== DRAW =====
function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // grid
  ctx.strokeStyle="#333";
  for(let x=0;x<COLS;x++)
    for(let y=0;y<ROWS;y++)
      ctx.strokeRect(x*TILE,y*TILE,TILE,TILE);

  // player
  ctx.fillStyle="lime";
  ctx.fillRect(player.x*TILE+5, player.y*TILE+5, player.size, player.size);

  // enemies
  enemies.forEach(e=>{
    if(e.hp>0){
      ctx.fillStyle="orange";
      ctx.fillRect(e.x*TILE+10,e.y*TILE+10,TILE-20,TILE-20);
    }
  });

  // boss
  if(boss.hp>0){
    ctx.fillStyle="red";
    ctx.fillRect(boss.x*TILE+5,boss.y*TILE+5,TILE-10,TILE-10);
  }

  // particles
  particles.forEach(p=>{
    ctx.fillStyle=p.c;
    ctx.fillRect(p.x,p.y,3,3);
  });

  // HUD
  document.getElementById("hud").innerText =
    "HP: "+Math.max(0,Math.floor(player.hp))+
    " | Boss HP: "+Math.max(0,Math.floor(boss.hp));
}

// ===== LOOP =====
function loop(){
  update();
  draw();

  if(player.hp<=0){
    document.getElementById("message").innerText="💀 YOU DIED";
    return;
  }
  if(boss.hp<=0){
    document.getElementById("message").innerText="🏆 BOSS DEFEATED!";
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
