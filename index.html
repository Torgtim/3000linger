<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer Adventure</title>
<style>
body {
  margin:0;
  overflow:hidden;
  font-family: Arial, sans-serif;
  background:#222;
}
canvas { 
  display:block; 
  margin:0 auto; 
  background:#333;
}
#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-size:18px;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">Health: 100 | Ammo: 0 | Bosses: 0</div>

<script>
// =================================================
// GLOBAL VARS
// =================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

const tileSize = 50;
let mapCols = Math.floor(width / tileSize);
let mapRows = Math.floor(height / tileSize);

// Player
let player = { x:2, y:2, size:40, color:'#0f0', health:100, ammo:0 };

// Items
let weapons = [{x:5, y:5, type:'Pistol'}, {x:10, y:8, type:'Shotgun'}];
let bosses = [{x:15, y:10, health:200, defeated:false}];

// Input
let keys = {};
window.addEventListener('keydown', e=>keys[e.key]=true);
window.addEventListener('keyup', e=>keys[e.key]=false);

// Draw map grid
function drawMap(){
  ctx.strokeStyle='#555';
  for(let i=0;i<mapCols;i++){
    for(let j=0;j<mapRows;j++){
      ctx.strokeRect(i*tileSize,j*tileSize,tileSize,tileSize);
    }
  }
}

// Draw player
function drawPlayer(){
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x*tileSize+5, player.y*tileSize+5, player.size, player.size);
}

// Draw weapons
function drawWeapons(){
  weapons.forEach(w=>{
    ctx.fillStyle='yellow';
    ctx.fillRect(w.x*tileSize+15, w.y*tileSize+15,20,20);
  });
}

// Draw bosses
function drawBosses(){
  bosses.forEach(b=>{
    if(!b.defeated){
      ctx.fillStyle='red';
      ctx.fillRect(b.x*tileSize+5, b.y*tileSize+5,40,40);
    }
  });
}

// Update
function update(){
  if(keys['ArrowUp'] && player.y>0) player.y--;
  if(keys['ArrowDown'] && player.y<mapRows-1) player.y++;
  if(keys['ArrowLeft'] && player.x>0) player.x--;
  if(keys['ArrowRight'] && player.x<mapCols-1) player.x++;

  // Check weapon pickups
  weapons.forEach((w,i)=>{
    if(player.x===w.x && player.y===w.y){
      player.ammo++;
      weapons.splice(i,1);
    }
  });

  // Check boss encounter
  bosses.forEach(b=>{
    if(!b.defeated && player.x===b.x && player.y===b.y){
      if(player.ammo>0){
        player.ammo--;
        b.health-=50;
        if(b.health<=0) b.defeated=true;
      } else {
        player.health-=10;
      }
    }
  });

  // Update HUD
  document.getElementById('hud').innerText=`Health: ${player.health} | Ammo: ${player.ammo} | Bosses: ${bosses.filter(b=>!b.defeated).length}`;
}

// Draw everything
function draw(){
  ctx.clearRect(0,0,width,height);
  drawMap();
  drawWeapons();
  drawBosses();
  drawPlayer();
}

// Game loop
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
