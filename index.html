<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA Explorer Chaos</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial;touch-action:none}
canvas{display:block;background:#111}
#hud{position:absolute;top:10px;left:10px;color:#fff}
#msg{position:absolute;bottom:100px;left:10px;color:yellow}

#joy{position:absolute;bottom:10px;left:10px;width:120px;height:120px;background:#ffffff11;border-radius:50%}
#stick{position:absolute;left:40px;top:40px;width:40px;height:40px;background:#ffffff88;border-radius:50%}
#shoot{position:absolute;bottom:10px;right:10px;width:90px;height:90px;background:red;border-radius:50%;opacity:.7}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"></div>

<div id="joy"><div id="stick"></div></div>
<div id="shoot"></div>

<script>
// ===== CANVAS =====
const c=document.getElementById("c");
const x=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

const TILE=48;
let camX=0,camY=0;
let shake=0;

// ===== PLAYER =====
let p={
x:500,y:1500,
vx:0,vy:0,
hp:100,armor:25,
weapon:0
};

// ===== JOYSTICK =====
let mx=0,my=0,shoot=false;
const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

joy.addEventListener("touchmove",e=>{
let t=e.touches[0],r=joy.getBoundingClientRect();
let dx=t.clientX-(r.left+r.width/2);
let dy=t.clientY-(r.top+r.height/2);
let d=Math.min(Math.hypot(dx,dy),r.width/2);
let a=Math.atan2(dy,dx);
mx=Math.cos(a)*(d/r.width);
my=Math.sin(a)*(d/r.height);
stick.style.left=(40+dx/2)+"px";
stick.style.top=(40+dy/2)+"px";
});
joy.addEventListener("touchend",()=>{mx=my=0;stick.style.left="40px";stick.style.top="40px"});
document.getElementById("shoot").ontouchstart=()=>shoot=true;
document.getElementById("shoot").ontouchend=()=>shoot=false;

// ===== ENEMIES =====
let enemies=[];
for(let i=0;i<20;i++){
enemies.push({x:Math.random()*2000,y:Math.random()*2000,hp:40});
}

// ===== BOSS =====
let boss={x:900,y:300,hp:600,phase:1};

// ===== PARTICLES =====
let parts=[];
function boom(px,py,cnt,col){
for(let i=0;i<cnt;i++){
parts.push({x:px,y:py,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,l:40,c:col});
}
shake=8;
}

// ===== BULLETS =====
let bullets=[];
function fire(){
if(p.weapon==0) bullets.push({x:p.x,y:p.y,vx:0,vy:-10,d:10});
if(p.weapon==1){for(let a=-0.3;a<=0.3;a+=0.3) bullets.push({x:p.x,y:p.y,vx:Math.sin(a)*8,vy:-8,d:8});}
if(p.weapon==2) bullets.push({x:p.x,y:p.y,vx:0,vy:-18,d:20});
}

// ===== UPDATE =====
function update(){

// smooth movement
p.vx+=mx*0.4;
p.vy+=my*0.4;
p.vx*=0.9;
p.vy*=0.9;
p.x+=p.vx;
p.y+=p.vy;

// camera follow
camX=p.x-c.width/2;
camY=p.y-c.height/2;

// regen
if(p.hp<100) p.hp+=0.01;

// shoot
if(shoot && Math.random()<0.4) fire();

// bullets
bullets.forEach((b,i)=>{
b.x+=b.vx;
b.y+=b.vy;

// hit enemies
enemies.forEach(e=>{
if(e.hp>0 && Math.hypot(e.x-b.x,e.y-b.y)<20){
e.hp-=b.d;
boom(e.x,e.y,10,"orange");
}
});

// hit boss
if(Math.hypot(boss.x-b.x,boss.y-b.y)<40){
boss.hp-=b.d;
boom(boss.x,boss.y,15,"red");
}
});

// enemy AI chase
enemies.forEach(e=>{
if(e.hp<=0) return;
let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);
e.x+=dx/d*1.2;
e.y+=dy/d*1.2;
if(d<25){p.hp-=0.05;}
});

// boss phases
if(boss.hp<400) boss.phase=2;
if(boss.hp<200) boss.phase=3;

let dx=p.x-boss.x,dy=p.y-boss.y,d=Math.hypot(dx,dy);
boss.x+=dx/d*(0.6+boss.phase*0.4);
boss.y+=dy/d*(0.6+boss.phase*0.4);
if(d<50) p.hp-=0.12*boss.phase;

// particles
parts.forEach((pp,i)=>{
pp.x+=pp.vx;
pp.y+=pp.vy;
pp.l--;
if(pp.l<=0) parts.splice(i,1);
});

if(shake>0) shake*=0.9;
}

// ===== DRAW =====
function draw(){
let sx=(Math.random()-0.5)*shake;
let sy=(Math.random()-0.5)*shake;
x.setTransform(1,0,0,1,-camX+sx,-camY+sy);
x.clearRect(camX,camY,c.width,c.height);

// player
x.fillStyle="lime";
x.fillRect(p.x-15,p.y-15,30,30);

// enemies
enemies.forEach(e=>{
if(e.hp>0){x.fillStyle="orange";x.fillRect(e.x-12,e.y-12,24,24);}
});

// boss
x.fillStyle="red";
x.fillRect(boss.x-25,boss.y-25,50,50);

// bullets
x.fillStyle="cyan";
bullets.forEach(b=>x.fillRect(b.x-2,b.y-6,4,10));

// particles
parts.forEach(pp=>{
x.fillStyle=pp.c;
x.fillRect(pp.x,pp.y,3,3);
});

// HUD
document.getElementById("hud").innerText=
"HP:"+Math.floor(p.hp)+" Armor:"+p.armor+
" | Boss:"+Math.floor(boss.hp)+" | Weapon:"+p.weapon;

if(p.hp<=0) document.getElementById("msg").innerText="💀 YOU DIED";
if(boss.hp<=0) document.getElementById("msg").innerText="🏆 BOSS DESTROYED";
}

// ===== LOOP =====
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();

// ===== WEAPON SWITCH =====
addEventListener("dblclick",()=>{
p.weapon=(p.weapon+1)%3;
document.getElementById("msg").innerText="Weapon "+p.weapon;
});
</script>
</body>
</html>
