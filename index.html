<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Space Shooter</title>
<style>
/* ======================== */
/*      GRUNNSTILER         */
/* ======================== */
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: black;
  touch-action: none;
}
canvas {
  display: block;
  margin: 0 auto;
  background: radial-gradient(circle at center, #000000, #001133);
}
#score {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #0f0;
  font-size: 24px;
  font-weight: bold;
}
#gameOver {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: red;
  font-size: 48px;
  display: none;
  text-align: center;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="score">Poeng: 0</div>
<div id="gameOver">GAME OVER!</div>

<script>
// =================================================
// GLOBAL VARIABLES
// =================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

let score = 0;
let gameOver = false;
let frame = 0;

// ===============================================
// PLAYER OBJECT
// ===============================================
const player = {
  x: width/2,
  y: height - 100,
  width: 50,
  height: 50,
  speed: 7,
  color: '#0f0',
  bullets: [],
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.width/2, this.y + this.height);
    ctx.lineTo(this.x + this.width/2, this.y + this.height);
    ctx.closePath();
    ctx.fill();
  },
  move(dir) {
    if (dir === 'left' && this.x - this.width/2 > 0) this.x -= this.speed;
    if (dir === 'right' && this.x + this.width/2 < width) this.x += this.speed;
  },
  shoot() {
    this.bullets.push({x: this.x, y: this.y, width: 5, height: 20, speed: 10});
  },
  updateBullets() {
    for(let i=this.bullets.length-1; i>=0; i--){
      this.bullets[i].y -= this.bullets[i].speed;
      if(this.bullets[i].y < 0) this.bullets.splice(i,1);
    }
  },
  drawBullets() {
    ctx.fillStyle = '#ff0';
    this.bullets.forEach(b => ctx.fillRect(b.x - b.width/2, b.y, b.width, b.height));
  }
};

// ===============================================
// ENEMY OBJECTS
// ===============================================
let enemies = [];
function spawnEnemy(){
  let size = Math.random()*30 + 20;
  enemies.push({
    x: Math.random()*(width - size),
    y: -size,
    width: size,
    height: size,
    speed: Math.random()*2 + 1,
    color: '#f00'
  });
}

function updateEnemies(){
  for(let i=enemies.length-1; i>=0; i--){
    enemies[i].y += enemies[i].speed;
    // Collision with player bullets
    for(let j=player.bullets.length-1; j>=0; j--){
      if(player.bullets[j].x < enemies[i].x + enemies[i].width &&
         player.bullets[j].x > enemies[i].x &&
         player.bullets[j].y < enemies[i].y + enemies[i].height &&
         player.bullets[j].y > enemies[i].y){
           enemies.splice(i,1);
           player.bullets.splice(j,1);
           score += 10;
           break;
         }
    }
    // Enemy hits bottom
    if(enemies[i] && enemies[i].y > height) enemies.splice(i,1);
  }
}

function drawEnemies(){
  enemies.forEach(e=>{
    ctx.fillStyle = e.color;
    ctx.fillRect(e.x, e.y, e.width, e.height);
  });
}

// ===============================================
// CONTROLS
// ===============================================
let keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Touch controls
let touchX = null;
canvas.addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
});
canvas.addEventListener('touchmove', e => {
  let dx = e.touches[0].clientX - touchX;
  player.x += dx;
  touchX = e.touches[0].clientX;
});

// ===============================================
// GAME LOOP
// ===============================================
function gameLoop(){
  if(gameOver) return;
  frame++;
  ctx.clearRect(0,0,width,height);

  // Background stars
  for(let i=0;i<100;i++){
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.random()*width, Math.random()*height, 2,2);
  }

  // Player
  if(keys['ArrowLeft']) player.move('left');
  if(keys['ArrowRight']) player.move('right');
  if(keys[' ']) player.shoot();

  player.updateBullets();
  player.drawBullets();
  player.draw();

  // Enemies
  if(frame % 50 === 0) spawnEnemy();
  updateEnemies();
  drawEnemies();

  // Score
  document.getElementById('score').innerText = 'Poeng: ' + score;

  // Check collision with player
  for(let e of enemies){
    if(player.x > e.x && player.x < e.x + e.width &&
       player.y < e.y + e.height &&
       player.y + player.height > e.y){
         gameOver = true;
         document.getElementById('gameOver').style.display='block';
       }
  }

  requestAnimationFrame(gameLoop);
}

// Start game
gameLoop();

</script>
</body>
</html>
